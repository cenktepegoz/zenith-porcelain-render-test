services:
  - type: web
    name: zenith-porcelain-test
    runtime: node
    region: frankfurt
    plan: starter
    buildCommand: >-
      curl -fsSL
      https://github.com/cenktepegoz/zenith-porcelain-render-test/releases/download/seo-aio-final-2026-08-24/zenith-porcelain-source-seo-aio-final-2026-08-24.tar.gz
      -o /tmp/zenith-source.tar.gz
      && tar -xzf /tmp/zenith-source.tar.gz
      && corepack pnpm install --frozen-lockfile
      && corepack pnpm build
    startCommand: corepack pnpm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_VERSION
        value: seo-aio-final-2026-08-24
